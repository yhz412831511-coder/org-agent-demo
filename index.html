<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>组织智能体 · 内部演示</title>
<style>
:root{
  --bg:#EDF0F3;--surface:#fff;--ink:#17233B;--muted:#5B6577;--faint:#8A93A3;--line:#DCE1E7;--soft:#F5F7F9;
  --blue:#2D5BE3;--twin:#0F8B7D;--twin-soft:#E4F3F0;--twin-line:#BBDFD8;--me:#B7720B;--me-soft:#FBF1DF;--me-line:#EBCB93;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.6 var(--sans);color:var(--ink);background:var(--bg);display:grid;grid-template-rows:56px 1fr;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:28px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font:600 15px var(--sans);white-space:nowrap}
.brand small{font-weight:400;color:var(--muted);margin-left:8px}
.acts{display:flex;gap:2px;flex:1;justify-content:center}
.acts button{padding:6px 12px;border-radius:6px;color:var(--muted);white-space:nowrap}
.acts button b{font-weight:600;margin-right:6px;color:var(--faint)}
.acts button:hover{background:var(--soft);color:var(--ink)}
.acts button[aria-current="true"]{background:var(--ink);color:#fff}
.acts button[aria-current="true"] b{color:#9FB0CC}
.top .tool{padding:6px 12px;border:1px solid var(--line);border-radius:6px;color:var(--muted);white-space:nowrap}
.top .tool:hover{color:var(--ink);border-color:#b9c1cc}

/* ---------- layout ---------- */
.main{display:grid;grid-template-columns:1fr 400px;min-height:0}
.stage{position:relative;overflow:hidden;min-width:0}
.rig{position:absolute;left:50%;top:50%;display:flex;gap:40px;align-items:flex-start;transform-origin:center center}
.dev{display:flex;flex-direction:column;align-items:center;gap:12px}
.cap{font-size:14px;color:var(--muted)}
.cap b{color:var(--ink);font-weight:600;margin-right:6px}

/* ---------- guide ---------- */
.guide{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.g-scroll{flex:1;overflow:auto;padding:28px 28px 16px}
.g-act{font-size:13px;color:var(--muted)}
.g-title{font:600 25px/1.35 var(--serif);margin:6px 0 10px;letter-spacing:.5px}
.g-judge{font-size:14px;line-height:1.75;color:var(--muted);padding-bottom:18px;border-bottom:1px solid var(--line)}
.g-steps{list-style:none;margin:16px 0 4px}
.g-steps li{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:7px 8px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:13.5px;line-height:1.55}
.g-steps li:hover{background:var(--soft)}
.g-steps li.now{background:var(--soft);color:var(--ink)}
.g-steps li.done{color:var(--faint)}
.tag{align-self:start;margin-top:1px;font-size:12px;text-align:center;border-radius:4px;padding:0 4px;white-space:nowrap}
.tag.twin{color:var(--twin);background:var(--twin-soft)}
.tag.me{color:var(--me);background:var(--me-soft)}
.tag.scene{color:var(--muted);background:#EEF0F3}
.g-steps li .who{display:block;font-size:12px;color:var(--faint)}
.g-steps li.now .who{color:var(--muted)}
.g-say{margin:18px 0 4px;font:16.5px/1.85 var(--serif);color:var(--ink);min-height:4.5em}
.g-say .tag{display:inline-block;font-family:var(--sans);margin-right:8px;vertical-align:2px}
.g-more details{border-top:1px solid var(--line)}
.g-more summary{list-style:none;padding:12px 0;font-size:13.5px;color:var(--muted);cursor:pointer;display:flex;justify-content:space-between}
.g-more summary::after{content:"+";color:var(--faint)}
.g-more details[open] summary::after{content:"−"}
.g-more .body{padding:0 0 14px;font-size:13.5px;color:#3A4558}
.g-more .body li{margin:0 0 6px 18px}
.g-more .qa dt{font-weight:600}
.g-more .qa dd{margin:2px 0 10px;color:var(--muted)}
.g-foot{display:flex;gap:8px;align-items:center;padding:14px 28px;border-top:1px solid var(--line)}
.g-foot .count{font-size:13px;color:var(--faint);margin-right:auto}
.g-foot button{padding:8px 14px;border-radius:6px;border:1px solid var(--line)}
.g-foot button:hover{border-color:#b9c1cc}
.g-foot .next{background:var(--ink);color:#fff;border-color:var(--ink)}
.g-foot .next.me{background:var(--me);border-color:var(--me)}
.g-foot button[disabled]{opacity:.35;cursor:default}

/* ---------- device shells ---------- */
.phone{width:375px;height:780px;border-radius:46px;border:11px solid #1C2333;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 60px -30px rgba(23,35,59,.45)}
.ph-status{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:4px 26px 0;font-size:13px;font-weight:600}
.ph-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px}
.ph-head h1{font-size:20px;font-weight:600}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:#E8ECF4;color:var(--ink);flex:none}
.ph-body{flex:1;overflow:hidden;padding:4px 16px 12px;display:flex;flex-direction:column;gap:12px}
.ph-tabs{flex:none;display:flex;border-top:1px solid var(--line);padding:6px 0 18px}
.ph-tabs span{flex:1;text-align:center;font-size:11px;color:var(--faint)}
.ph-tabs span.on{color:var(--blue);font-weight:600}
.ph-tabs i{display:block;width:20px;height:20px;margin:2px auto 1px;border-radius:6px;border:1.6px solid currentColor}

.browser{width:1100px;height:720px;border-radius:12px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;border:1px solid #CDD3DC;box-shadow:0 30px 60px -32px rgba(23,35,59,.45)}
.chrome{height:36px;flex:none;display:flex;align-items:center;gap:7px;padding:0 14px;background:#F3F5F8;border-bottom:1px solid var(--line)}
.chrome i{width:11px;height:11px;border-radius:50%;background:#D5DAE1}
.chrome span{margin-left:16px;font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 14px}
.app{flex:1;display:grid;grid-template-columns:208px 1fr;min-height:0}
.side{background:var(--ink);color:#B9C4D8;padding:18px 14px;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.side .logo{color:#fff;font-weight:600;font-size:15px;padding:0 8px 16px;display:flex;align-items:center;gap:8px}
.side .logo i{width:22px;height:22px;border-radius:6px;background:var(--blue)}
.side .item{padding:7px 10px;border-radius:6px}
.side .item.on{background:rgba(255,255,255,.1);color:#fff}
.side .sec{font-size:12px;color:#7A88A3;padding:16px 10px 6px}
.side .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px 6px 0;border-top:1px solid rgba(255,255,255,.1)}
.side .me .avatar{background:#2C3B5A;color:#fff}
.side .me small{display:block;color:#7A88A3;font-size:12px}
.work{display:flex;flex-direction:column;min-width:0;min-height:0}
.crumb{height:46px;flex:none;display:flex;align-items:center;gap:8px;padding:0 24px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:600}
.split{flex:1;display:grid;grid-template-columns:1fr 300px;min-height:0}
.canvas{overflow:hidden;padding:26px 44px;min-width:0}
.panel{border-left:1px solid var(--line);background:#FAFBFC;padding:14px 16px;overflow:hidden;font-size:13px}
.ptabs{display:flex;gap:16px;border-bottom:1px solid var(--line);margin:0 -16px 12px;padding:0 16px}
.ptabs span{padding:6px 0 9px;color:var(--muted)}
.ptabs span.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px var(--blue)}

/* ---------- shared product parts ---------- */
.bubble{align-self:flex-end;max-width:84%;background:#E9EEFB;border-radius:16px 16px 4px 16px;padding:10px 13px;font-size:14px}
.twinsay{font-size:14px;line-height:1.65}
.twinsay .lbl,.proc .lbl{font-size:12px;color:var(--twin);display:flex;align-items:center;gap:6px;margin-bottom:3px}
.spark{width:10px;height:10px;transform:rotate(45deg);border-radius:2px;background:var(--twin);display:inline-block}
.proc{border-left:3px solid var(--twin);background:var(--twin-soft);border-radius:4px 10px 10px 4px;padding:11px 14px}
.proc ol{list-style:none;display:flex;flex-direction:column;gap:7px;margin-top:6px}
.proc li{font-size:13.5px;line-height:1.55;display:grid;grid-template-columns:14px 1fr;gap:6px;transition:opacity .35s,transform .35s}
.proc li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--twin);margin-top:7px}
.reveal > .pending,.reveal .pending{opacity:0;transform:translateY(4px)}
.src{display:inline-block;font-size:12px;line-height:18px;color:var(--twin);border:1px solid var(--twin-line);background:#fff;border-radius:4px;padding:0 6px;margin-left:4px;vertical-align:1px;cursor:pointer;white-space:nowrap}
.src:hover{background:var(--twin-soft)}
.est{font-size:12px;color:var(--muted);border:1px dashed #B5BDC9;border-radius:4px;padding:0 5px;margin-left:4px}
.card{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff}
.card h3{font-size:15px;font-weight:600;margin-bottom:6px}
.card .meta{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.go{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 18px;border-radius:10px;font-weight:600;background:var(--me);color:#fff}
.go.full{width:100%}
.go.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.go.sm{height:34px;font-size:13px;border-radius:8px;padding:0 14px}
.go.armed{animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(183,114,11,.45)}70%{box-shadow:0 0 0 12px rgba(183,114,11,0)}100%{box-shadow:0 0 0 0 rgba(183,114,11,0)}}
.done-mark{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--me);font-weight:600}
.done-mark::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--me)}
.composer{flex:none;margin:0 14px 10px;border:1px solid var(--line);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.composer .txt{font-size:14px;line-height:1.6}
.composer .hint{font-size:12px;color:var(--faint)}
.wave{display:inline-flex;gap:2px;align-items:center;height:14px;vertical-align:-2px;margin-right:6px}
.wave i{width:2px;background:var(--me);border-radius:2px}

/* document */
.doc-h{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.doc-h h2{font-size:22px;font-weight:600}
.state{font-size:12px;border-radius:4px;padding:1px 7px;white-space:nowrap}
.state.twin{background:var(--twin-soft);color:var(--twin)}
.state.me{background:var(--me-soft);color:var(--me)}
.state.ok{background:#E8EEF9;color:var(--blue)}
.doc-sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.para{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:9px 0;border-top:1px solid #EEF1F4;font-size:14px;line-height:1.75}
.para h4{font-size:14px;font-weight:600;margin-bottom:2px}
.kind{font-size:12px;text-align:center;border-radius:4px;height:20px;line-height:20px;margin-top:3px}
.kind.fact{background:#EEF1F5;color:var(--ink)}
.kind.judge{background:var(--twin-soft);color:var(--twin)}
.kind.check{border:1px dashed #A9B2BF;color:var(--muted)}
.cap3{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.cap3 span{border:1px solid var(--line);border-radius:6px;padding:2px 10px;font-size:13px}
.cap3 span.later{color:var(--faint);text-decoration:line-through}
.cap3 span.moved{border-style:dashed;color:var(--muted)}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:13px}
.flow span{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 9px}
.flow span.key{border-color:var(--twin-line);background:var(--twin-soft);color:var(--twin)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:7px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid #EEF1F4;vertical-align:top}
.verdict{font-weight:600}
.verdict.y{color:#1F7A44}.verdict.c{color:#9A6A07}.verdict.n{color:#A1453A}
.suggest{border:1px solid var(--twin-line);background:var(--twin-soft);border-radius:10px;padding:12px 14px;font-size:13.5px}
.actbar{display:flex;gap:10px;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.actbar .note{font-size:12.5px;color:var(--muted);margin-right:auto}
.pk{font-size:13px;color:var(--muted);margin:2px 0 6px}
.pitem{padding:8px 0;border-top:1px solid #EEF1F4;font-size:13px;line-height:1.55}

/* overview */
.ov{width:1180px;display:flex;flex-direction:column;gap:22px}
.ov-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px}
.ov-col{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px 24px}
.ov-col h3{font:600 22px var(--serif);margin:18px 0 4px}
.ov-col p{color:var(--muted);font-size:14px}
.ov-col ul{list-style:none;margin-top:14px;border-top:1px solid var(--line)}
.ov-col li{padding:9px 0;border-bottom:1px solid #EEF1F4;font-size:14px;display:flex;gap:14px}
.ov-col li b{font-weight:600;min-width:64px}
.mini{height:150px;border-radius:10px;background:var(--soft);display:grid;place-items:center}
.mini .m-phone{width:76px;height:136px;border:5px solid #1C2333;border-radius:16px;background:#fff;padding:14px 8px;display:flex;flex-direction:column;gap:6px}
.mini .m-pc{width:230px;height:128px;border:1px solid #CDD3DC;border-radius:6px;background:#fff;display:grid;grid-template-columns:44px 1fr;overflow:hidden}
.mini .m-pc .s{background:var(--ink)}
.mini .m-pc .d{padding:14px;display:flex;flex-direction:column;gap:6px}
.mini .m-gr{background:#0E1A2E}
.bar{height:6px;border-radius:3px;background:#DCE1E7}
.bar.t{background:var(--twin-line)}
.bar.m{background:var(--me-line)}
.ov-twin{background:var(--ink);color:#fff;border-radius:14px;padding:20px 28px;display:flex;align-items:center;gap:28px}
.ov-twin h3{font:600 22px var(--serif);white-space:nowrap}
.ov-twin p{color:#C9D2E3;font-size:15px}
.ov-legend{display:flex;gap:26px;font-size:14px;color:var(--muted);padding:0 4px}
.ov-legend span{display:flex;align-items:center;gap:8px}
.ov-legend i{width:10px;height:10px;border-radius:50%}



/* source dialog */
dialog{border:0;border-radius:14px;padding:0;width:min(560px,92vw);box-shadow:0 30px 80px -20px rgba(23,35,59,.5);color:var(--ink)}
dialog::backdrop{background:rgba(23,35,59,.35)}
.dl-h{padding:20px 24px 12px;border-bottom:1px solid var(--line)}
.dl-h small{color:var(--twin);font-size:12.5px}
.dl-h h3{font-size:18px;margin-top:2px}
.dl-h .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.dl-b{padding:16px 24px;font-size:14px;line-height:1.85;max-height:52vh;overflow:auto}
.dl-b p{margin-bottom:10px}
.dl-b mark{background:var(--twin-soft);color:inherit;box-shadow:inset 0 -2px var(--twin-line);padding:0 2px}
.dl-f{padding:12px 24px 18px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
.dl-f button{padding:7px 16px;border:1px solid var(--line);border-radius:6px;color:var(--ink)}

@media (prefers-reduced-motion:reduce){.go.armed{animation:none;box-shadow:0 0 0 3px rgba(183,114,11,.35)}.proc li{transition:none}}
@media (max-width:1100px){.main{grid-template-columns:1fr 340px}.acts button{padding:6px 8px}}

/* Responsive working surfaces: preserve readable text instead of shrinking devices. */
.main{grid-template-columns:minmax(0,1fr) 340px}
.top{gap:12px;padding:0 16px}.brand small{display:none}.acts button{padding:6px 9px}
.rig{gap:20px}.browser{width:var(--desk-width,1000px);height:var(--device-height,720px)}
.phone{height:var(--phone-height,780px)}
.app{grid-template-columns:156px minmax(0,1fr)}.side{padding:16px 10px}.side .item{padding:7px 8px}
.canvas{padding:20px 24px}.split{grid-template-columns:minmax(0,1fr) 220px}.panel{padding:12px}
.ptabs{gap:10px;margin-left:-12px;margin-right:-12px;padding:0 12px;flex-wrap:wrap}
.doc-h{flex-wrap:wrap;gap:6px 12px}.doc-h h2{font-size:20px}.doc-sub{margin-bottom:12px}
.para{gap:8px;padding:7px 0;line-height:1.65}.actbar{margin-top:12px;padding-top:10px}
.ov{width:var(--desk-width,1000px);gap:16px}.ov-cols{gap:14px}.ov-col{padding:16px}.ov-col li{gap:8px}.ov-col li b{min-width:70px}.ov-legend{gap:16px;font-size:13px}
.ph-tabs span{font-size:12px}.ph-body{gap:10px}.ph-body .pitem{padding:6px 0}.ph-body .pk{margin-bottom:2px}
.src{color:var(--blue);border-color:#CCD7F5}.src:hover{background:#EDF2FF}
.flow span.key{color:var(--ink);background:var(--soft);border-color:var(--line)}
.stack{display:flex;flex-direction:column;gap:12px}.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.cols.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.section-title{font-size:16px;margin-bottom:8px}.subtle{color:var(--muted);font-size:13px}.section-gap{margin-top:14px}
.info-line{padding:8px 0;border-bottom:1px solid var(--line)}.info-line:last-child{border-bottom:0}
.old{color:#7C5260;text-decoration:line-through}.new{background:#EDF2FF;color:#244BA9;padding:7px 9px;border-left:3px solid var(--blue);margin-top:6px}
.issue{border-left:3px solid #B53D48;background:#FCF0F1;padding:12px;border-radius:6px}.issue.warning{border-color:#A18B00;background:#F9F8DF}.issue h3{font-size:15px;margin-bottom:5px}
.issue .fix{margin-top:6px;font-size:13px}.state.blocked{color:#B12F42;background:#FCECF0}.state.wait{color:#665C79;background:#F0EDF6}
.matrix td,.matrix th{text-align:center;padding:8px 6px}.matrix td:first-child,.matrix th:first-child{text-align:left}.matrix td:not(:first-child){color:var(--muted)}
.link-button{color:var(--blue);text-decoration:underline;text-underline-offset:3px;font-size:13px}.record{padding:10px 12px;background:var(--soft);border-radius:8px}
.counts{display:flex;gap:12px;margin:12px 0}.counts>div{flex:1;background:var(--soft);padding:10px;border:1px solid var(--line);border-radius:8px}.counts strong{font-size:22px;margin-right:6px}
.discussion{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}.discussion .secretary{border-left:1px solid var(--line);padding-left:18px}.chat{padding:10px 0;border-bottom:1px solid var(--line)}.chat b{display:block;font-size:13px;margin-bottom:5px}.chat p{background:var(--soft);padding:10px;border-radius:0 10px 10px 10px}
.waiting{border:1px solid #D1C9DE;background:#F3F0F8;color:#514366;padding:10px;border-radius:8px;font-weight:600}
.handover{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:18px}.handover .info-line{padding:7px 0;font-size:13px}.private{background:var(--soft);border:1px dashed #B7C0CF;padding:12px;border-radius:8px;align-self:start}

 steps:[

/* =====================================================================
   六、播放引擎
   ===================================================================== */
const $ = s => document.querySelector(s);
const rig = $('#rig'), stage = $('#stage'), guide = $('#guide');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let A = 0, S = 0, timer = null, revealStart = null, paused = false, revealing = false;

$('#acts').innerHTML = ACTS.map((a,i)=>`<button data-a="${i}"><b>${a.tab}</b>${a.name}</button>`).join('');
$('#acts').addEventListener('click', e=>{const b=e.target.closest('[data-a]'); if(b) goTo(+b.dataset.a,0);});
$('#replay').onclick = ()=>goTo(A,0);

function goTo(a,s){ A=a; S=s; history.replaceState(null,'',`#${a}-${s}`); render(); }
function step(){ return ACTS[A].steps[S]; }

function render(){
  clearInterval(timer); clearTimeout(revealStart); timer=null; paused=false;
  const st = step();
  rig.innerHTML = st.view.map(v=>`<div class="dev">${v.r()}${v.cap?`<div class="cap">${v.cap}</div>`:''}</div>`).join('');
  document.querySelectorAll('#acts button').forEach((b,i)=>b.setAttribute('aria-current', i===A));
  rig.querySelectorAll('[data-go]').forEach(b=>{ if(st.k==='me') b.classList.add('armed'); });
  renderGuide(); fit();
  if(st.k==='twin') startReveal(); else revealing=false;
}

function startReveal(){
  const items=[...rig.querySelectorAll('.reveal > *')];
  if(reduce || !items.length){ revealing=false; return; }
  items.forEach(el=>el.classList.add('pending')); revealing=true; let i=0;
  const tick=()=>{ if(paused) return; const el=items[i++]; if(el) el.classList.remove('pending'); if(i>=items.length){ clearInterval(timer); revealing=false; renderFoot(); } };
  revealStart=setTimeout(tick,250); timer=setInterval(tick,700); renderFoot();
}
function finishReveal(){ clearInterval(timer); clearTimeout(revealStart); rig.querySelectorAll('.pending').forEach(el=>el.classList.remove('pending')); revealing=false; renderFoot(); }

function next(){
  if(revealing){ finishReveal(); return; }
  const act=ACTS[A];
  if(S<act.steps.length-1) goTo(A,S+1); else if(A<ACTS.length-1) goTo(A+1,0);
}
function prev(){ if(S>0) goTo(A,S-1); else if(A>0) goTo(A-1,ACTS[A-1].steps.length-1); }

const KIND = {twin:'分身', me:'本人', scene:'画面'};
function renderGuide(){
  const act=ACTS[A], st=step();
  const list = act.steps.map((s,i)=>`<li class="${i===S?'now':i<S?'done':''}" data-s="${i}"><span class="tag ${s.k}">${KIND[s.k]}</span><span>${s.who?`<span class="who">${s.who}</span>`:''}${s.text}</span></li>`).join('');
  const sec = (t,body)=> body ? `<details><summary>${t}</summary><div class="body">${body}</div></details>` : '';
  guide.innerHTML = `<div class="g-scroll">
      <div class="g-act">${A===0?'序幕':A>6?act.tab:`第${act.tab}幕`} · ${act.name}</div>
      <h2 class="g-title">${act.title}</h2>
      <p class="g-judge">${act.judge}</p>
      <p class="g-say"><span class="tag ${st.k}">${KIND[st.k]}</span>${st.say || '<span style="color:var(--faint);font-size:14px">讲稿待写</span>'}</p>
      <ol class="g-steps">${list}</ol>
      <div class="g-more">
        ${sec('本幕要点', act.points.length?`<ul>${act.points.map(p=>`<li>${p}</li>`).join('')}</ul>`:'')}
        ${sec('预判提问', act.qa.length?`<dl class="qa">${act.qa.map(([q,a])=>`<dt>${q}</dt><dd>${a}</dd>`).join('')}</dl>`:'')}
        ${sec('演示设定', act.setting.length?`<ul>${act.setting.map(p=>`<li>${p}</li>`).join('')}</ul>`:'')}
      </div></div><div class="g-foot" id="foot"></div>`;
  guide.querySelectorAll('[data-s]').forEach(li=>li.onclick=()=>goTo(A,+li.dataset.s));
  renderFoot();
}
function renderFoot(){
  const foot=$('#foot'); if(!foot) return;
  const act=ACTS[A], st=step(), last = A===ACTS.length-1 && S===act.steps.length-1;
  const label = revealing ? '显示全部' : st.k==='me' && rig.querySelector('[data-go]') ? '代为点击' : S===act.steps.length-1 ? '下一幕' : '下一步';
  foot.innerHTML = `<span class="count">${S+1} / ${act.steps.length}</span>
    ${st.k==='twin'&&revealing?`<button id="pause">${paused?'继续':'暂停'}</button>`:''}
    <button id="prev" ${A===0&&S===0?'disabled':''}>上一步</button>
    <button id="next" class="next ${st.k==='me'&&!revealing?'me':''}" ${last?'disabled':''}>${label}</button>`;
  $('#prev').onclick=prev; $('#next').onclick=next;
  const p=$('#pause'); if(p) p.onclick=togglePause;
}
function togglePause(){ paused=!paused; renderFoot(); }

function fit(){
  const W=stage.clientWidth-40, H=stage.clientHeight-32;
  rig.style.setProperty('--desk-width',`${Math.min(1040,W)}px`);
  rig.style.setProperty('--device-height',`${Math.min(720,H-34)}px`);
  rig.style.setProperty('--phone-height',`${Math.min(780,H-34)}px`);
  rig.style.transform='translate(-50%,-50%) scale(1)';
  const w=rig.offsetWidth, h=rig.offsetHeight;
  const scale=Math.min(W/w,H/h,1);
  rig.style.transform=`translate(-50%,-50%) scale(${scale})`;
}
addEventListener('resize', fit);

rig.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ') && e.target.closest('[data-drill]')){e.preventDefault();e.stopPropagation();goTo(7,1);}});
rig.addEventListener('click', e=>{
  const s=e.target.closest('[data-src]'); if(s){ openSrc(s.dataset.src); return; }
  const drill=e.target.closest('[data-drill]'); if(drill){goTo(7,1);return;}
  const cap=e.target.closest('[data-capability]'); if(cap){goTo(8,cap.dataset.capability==='candidate'?1:2);return;}
  if(e.target.closest('[data-go]') && step().k==='me'){
    const result=e.target.closest('[data-result]');
    if(result){
      const view=result.dataset.result==='discussion'?a5_group({phase:'done'}):a6_takeover({done:true});
      rig.querySelector('.dev').innerHTML=view+`<div class="cap"><b>${step().who}</b>PC</div>`;
      fit();renderFoot();return;
    }
    next();
  }
});

const dlg=$('#dlg');
function openSrc(id){
  const d=SRC[id];
  dlg.innerHTML=`<div class="dl-h"><small>出处</small><h3>${d.title}</h3><div class="meta">${d.meta}</div></div>
    <div class="dl-b">${d.body.map((p,i)=>`<p>${d.mark.includes(i)?`<mark>${p}</mark>`:p}</p>`).join('')}</div>
    <div class="dl-f"><span>高亮为本次引用的段落</span><button autofocus>关闭</button></div>`;
  dlg.querySelector('button').onclick=()=>dlg.close();
  dlg.showModal();
}
dlg.addEventListener('click', e=>{ if(e.target===dlg) dlg.close(); });

addEventListener('keydown', e=>{
  if(dlg.open || e.metaKey || e.ctrlKey) return;
  if(e.key==='ArrowRight'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); prev(); }
  else if(e.key===' '){ e.preventDefault(); if(revealing) togglePause(); else next(); }
  else if(e.key==='r'||e.key==='R') goTo(A,0);
  else if(/^[1-9]$/.test(e.key) && +e.key-1<ACTS.length) goTo(+e.key-1,0);
  else if(e.key==='0') goTo(0,0);
});

const m=location.hash.match(/^#(\d+)-(\d+)$/);
if(m && ACTS[+m[1]] && ACTS[+m[1]].steps[+m[2]]) { A=+m[1]; S=+m[2]; }
render();
</script>
